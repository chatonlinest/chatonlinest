<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST-Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<style>
  :root {
    --bg:       #0a0c10;
    --surface:  #111418;
    --panel:    #161b22;
    --border:   #21262d;
    --accent:   #00e5c4;
    --accent2:  #0af0d0;
    --muted:    #8b949e;
    --text:     #e6edf3;
    --user-bubble: #003d35;
    --bot-bubble:  #161b22;
    --danger:   #f85149;
    --radius:   0;
    --font-ui:  'Syne', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,196,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,196,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Radial glow behind chat */
  body::after {
    content: '';
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(0,229,196,.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── LAYOUT ─────────────────────────────────────── */
  .app {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 860px;
    height: 100dvh;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    background: var(--surface);
  }

  /* ── HEADER ─────────────────────────────────────── */
  .chat-header {
    padding: 0 20px;
    height: 64px;
    min-height: 64px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .chat-avatar {
    width: 38px;
    height: 38px;
    border-radius: 0;
    background: linear-gradient(135deg, var(--accent), #006e8a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600; 
    color: #000;
    flex-shrink: 0;
    position: relative;
  }

  .chat-avatar::after {
    content: '';
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 10px; 
    height: 10px;
    border-radius: 50%;
    background: #3fb950;
    border: 2px solid var(--panel);
  }

  .chat-info { flex: 1; min-width: 0; }

  .chat-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--text);
  }

  .chat-status {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    margin-top: 1px;
    opacity: .8;
  }

  .settings-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: all .2s;
  }
  .settings-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,229,196,.06);
  }

  /* ── MESSAGES ───────────────────────────────────── */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  } 
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Date separator */
  .date-sep {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin: 8px 0;
    position: relative;
  }
  .date-sep::before, .date-sep::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 50px);
    height: 1px;
    background: var(--border);
  }
  .date-sep::before { left: 0; }
  .date-sep::after { right: 0; }

  .msg-row {
    display: flex;
    animation: slideIn .22s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot  { justify-content: flex-start; }

  .bubble {
    max-width: 70%;
    padding: 10px 13px 8px;
    border-radius: var(--radius);
    position: relative;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(0,229,196,.12);
    border-bottom-right-radius: 0;
  }

  .msg-row.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 0;
  }

  .bubble-content {
    font-size: 14px;
    line-height: 20px;
    white-space: pre-wrap; 
    word-wrap: break-word;
    color: var(--text);
  }

  .bubble-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .msg-time {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    opacity: .7;
  }

  /* ── WELCOME CARD ───────────────────────────────── */
  .welcome-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius); 
    padding: 20px;
    text-align: center;
    max-width: 400px;
    width: 100%;
    align-self: center;
    margin: auto;
    animation: slideIn .35s ease-out;
  }

  .welcome-icon {
    width: 56px;
    height: 56px;
    border-radius: 0;
    background: linear-gradient(135deg, var(--accent), #006e8a);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 24px;
  }

  .welcome-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text);
  }

  .welcome-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .welcome-step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 10px 12px;
    margin-top: 10px;
    text-align: left;
  }

  .step-num {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(0,229,196,.1); 
    border-radius: 5px;
    padding: 2px 6px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .step-text { font-size: 13px; color: var(--muted); line-height: 1.5; }

  /* ── FILE BUBBLE ────────────────────────────────── */
  .file-bubble-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 12px 14px;
    min-width: 260px;
    max-width: 360px;
  }

  .file-icon-box {
    width: 44px;
    height: 44px;
    border-radius: 0;
    background: rgba(0,229,196,.12);
    border: 1px solid rgba(0,229,196,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-icon-box svg { color: var(--accent); }

  .file-meta { flex: 1; min-width: 0; }
  .file-name-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }
  .file-size-text {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    border: none;
    border-radius: 0;
    color: #000;
    padding: 5px 12px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    transition: opacity .15s;
  }
  .download-btn:hover { opacity: .85; }

  /* ── CODE BLOCK ─────────────────────────────────── */
  .code-block {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 18px;
    overflow-x: auto;
    margin-top: 6px;
    max-height: 300px;
    overflow-y: auto;
  } 
  .diff-add { background: rgba(63,185,80,.2); color: #3fb950; border-radius: 0; }
  .diff-rem { background: rgba(248,81,73,.15); color: #f85149; text-decoration: line-through; border-radius: 2px; }

  /* ── INPUT BAR ──────────────────────────────────── */
  .chat-input {
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .input-box {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: border-color .2s;
  }
  .input-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,196,.07);
  }

  .file-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    transition: color .2s;
    flex-shrink: 0;
    padding: 2px;
  }
  .file-btn:hover { color: var(--accent); }
  .file-btn.hidden { display: none; }

  .input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
  }
  .input-box input::placeholder { color: var(--muted); opacity: .6; }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 0;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { opacity: .85; transform: scale(1.05); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; opacity: .6; }
  .send-btn svg { color: #000; }

  /* Typing indicator */
  .typing-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: dot .9s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes dot {
    0%, 80%, 100% { transform: scale(.6); opacity: .4; }
    40% { transform: scale(1); opacity: 1; }
  }

  /* ── MODAL ──────────────────────────────────────── */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal.active { display: flex; }

  .modal-content {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 28px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 24px 64px rgba(0,0,0,.5);
    animation: slideIn .2s ease-out;
  }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .modal-icon {
    width: 36px;
    height: 36px;
    border-radius: 0;
    background: rgba(0,229,196,.12);
    border: 1px solid rgba(0,229,196,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .modal-title { font-size: 17px; font-weight: 700; }

  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 7px;
    text-transform: uppercase;
    letter-spacing: .8px;
  }

  .modal-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 10px 13px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  .modal-field input:focus { border-color: var(--accent); }
  .modal-field input::placeholder { color: var(--muted); opacity: .5; }

  .modal-hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.5;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 24px;
  }

  .modal-btn {
    padding: 9px 20px;
    border: none;
    border-radius: 0;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 600;
    transition: all .2s;
  }
  .modal-btn.cancel {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .modal-btn.cancel:hover { border-color: var(--muted); color: var(--text); }
  .modal-btn.save {
    background: var(--accent);
    color: #000;
  }
  .modal-btn.save:hover { opacity: .85; }

  /* ── STATUS BADGE ───────────────────────────────── */
  .status-online { color: #3fb950 !important; }
  .status-typing { color: var(--accent) !important; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  /* ── FILE INPUT HIDDEN ──────────────────────────── */
  .file-input { display: none; }

  /* ── RESPONSIVE ─────────────────────────────────── */
  @media (max-width: 640px) {
    .bubble { max-width: 88%; }
    .chat-messages { padding: 14px 14px; } 
    .file-bubble-wrap { min-width: 200px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="chat-header">
    <div class="chat-avatar">ST</div>
    <div class="chat-info">
      <div class="chat-name">ST-Bot</div>
      <div class="chat-status" id="chatStatus">● configure a API</div>
    </div>
    <button class="settings-btn" id="settingsBtn" title="Configurações">⚙</button>
  </div>

  <!-- MESSAGES -->
  <div class="chat-messages" id="chatMessages"></div>

  <!-- INPUT BAR -->
  <div class="chat-input">
    <div class="input-box">
      <button class="file-btn" id="fileBtn" title="Anexar arquivo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
        </svg>
      </button>
      <input type="file" id="fileInput" class="file-input" accept=".txt,.js,.py,.html,.css,.json,.md,.ts,.jsx,.tsx,.vue,.php,.rb,.go,.rs">
      <input type="text" id="userInput" placeholder="Configure a API primeiro..." disabled>
    </div>
    <button class="send-btn" id="sendBtn" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-icon">⚙</div>
      <div class="modal-title">Configurações da API</div>
    </div>

    <div class="modal-field">
      <label>API Key do Gemini</label>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
      <div class="modal-hint">Obtenha em <strong>aistudio.google.com</strong></div>
    </div>

    <div class="modal-field">
      <label>Modelo</label>
      <input type="text" id="modelInput" placeholder="gemini-2.5-flash">
      <div class="modal-hint">Padrão: <code>gemini-2.5-flash</code></div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn cancel" id="cancelBtn">Cancelar</button>
      <button class="modal-btn save" id="saveBtn">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────
let API_KEY = localStorage.getItem('stbot_api_key') || '';
let MODEL   = localStorage.getItem('stbot_model')   || 'gemini-2.5-flash';

let originalContent  = '';
let originalFileName = '';
let modifiedContent  = '';
let typingRow        = null;

// ── ELEMENTS ───────────────────────────────────────
const chatMessages  = document.getElementById('chatMessages');
const userInput     = document.getElementById('userInput');
const sendBtn       = document.getElementById('sendBtn');
const chatStatus    = document.getElementById('chatStatus');
const fileBtn       = document.getElementById('fileBtn');
const fileInput     = document.getElementById('fileInput');
const settingsBtn   = document.getElementById('settingsBtn');
const settingsModal = document.getElementById('settingsModal');
const apiKeyInput   = document.getElementById('apiKeyInput');
const modelInput    = document.getElementById('modelInput');
const saveBtn       = document.getElementById('saveBtn');
const cancelBtn     = document.getElementById('cancelBtn');

// ── INIT ───────────────────────────────────────────
window.onload = () => { checkConfig(); addWelcomeCard(); };

function checkConfig() {
  if (!API_KEY || !MODEL) {
    chatStatus.textContent = '● configure a API';
    chatStatus.className   = 'chat-status';
    userInput.placeholder  = 'Configure a API primeiro...';
    userInput.disabled     = true;
    fileBtn.disabled       = true;
  } else {
    chatStatus.textContent = '● Online';
    chatStatus.className   = 'chat-status status-online';
    userInput.placeholder  = 'Descreva a modificação...';
    fileBtn.disabled       = false;
  }
}

// ── SETTINGS ───────────────────────────────────────
settingsBtn.addEventListener('click', () => {
  apiKeyInput.value = API_KEY;
  modelInput.value  = MODEL;
  settingsModal.classList.add('active');
  setTimeout(() => apiKeyInput.focus(), 100);
});

cancelBtn.addEventListener('click', () => settingsModal.classList.remove('active'));

settingsModal.addEventListener('click', (e) => {
  if (e.target === settingsModal) settingsModal.classList.remove('active');
});

saveBtn.addEventListener('click', () => {
  const newKey   = apiKeyInput.value.trim();
  const newModel = modelInput.value.trim() || 'gemini-2.5-flash';
  if (!newKey) { apiKeyInput.focus(); return; }

  API_KEY = newKey;
  MODEL   = newModel;
  localStorage.setItem('stbot_api_key', API_KEY);
  localStorage.setItem('stbot_model',   MODEL);

  settingsModal.classList.remove('active');
  checkConfig();
  addBotMsg('✓ Configurações salvas! Agora envie um arquivo para começar.');
});

// ── WELCOME CARD ───────────────────────────────────
function addWelcomeCard() {
  const el = document.createElement('div');
  el.className = 'msg-row bot';
  el.innerHTML = `
    <div class="welcome-card">
      <div class="welcome-icon">🤖</div>
      <div class="welcome-title">ST-Bot — Editor com IA</div>
      <div class="welcome-desc">Envie qualquer arquivo de código e instrua o bot a modificá-lo usando o modelo Gemini.</div>
      <div class="welcome-step">
        <span class="step-num">01</span>
        <span class="step-text">Clique em ⚙ e configure sua API key do Gemini</span>
      </div>
      <div class="welcome-step">
        <span class="step-num">02</span>
        <span class="step-text">Clique no clipe 📎 e carregue seu arquivo de código</span>
      </div>
      <div class="welcome-step">
        <span class="step-num">03</span>
        <span class="step-text">Descreva a modificação que deseja — o bot gera e aplica o patch automaticamente</span>
      </div>
    </div>
  `;
  chatMessages.appendChild(el);
  scroll();
}

// ── FILE HANDLING ──────────────────────────────────
fileBtn.addEventListener('click', () => {
  if (!API_KEY || !MODEL) {
    addBotMsg('Configure sua API key primeiro clicando em ⚙.');
    return;
  }
  fileInput.click();
});

fileInput.addEventListener('change', handleFile);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  originalFileName = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    originalContent = ev.target.result;
    modifiedContent = originalContent;

    const kb = (file.size / 1024).toFixed(1);
    addBotMsg(`📂 **${file.name}** carregado — ${kb} KB`);
    addBotMsg('O que você quer modificar neste arquivo?');

    fileBtn.classList.add('hidden');
    userInput.disabled = false;
    userInput.focus();
    chatStatus.textContent = '● online';
    chatStatus.className   = 'chat-status status-online';
    scroll();
  };
  reader.readAsText(file);
  fileInput.value = '';
}

// ── SEND ───────────────────────────────────────────
sendBtn.addEventListener('click', sendRequest);
userInput.addEventListener('input', () => {
  sendBtn.disabled = !userInput.value.trim() || !originalContent;
});
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !sendBtn.disabled) {
    e.preventDefault();
    sendRequest();
  }
});

async function sendRequest() {
  const instruction = userInput.value.trim();
  if (!instruction || !originalContent || !API_KEY || !MODEL) return;

  addUserMsg(instruction);
  userInput.value  = '';
  sendBtn.disabled = true;

  chatStatus.textContent = '● digitando...';
  chatStatus.className   = 'chat-status status-typing';

  showTyping();

  try {
    const patch = await generatePatch(instruction, modifiedContent);
    removeTyping();
    if (!patch) throw new Error('Modelo não retornou patch válido');

    const newContent = applyPatch(modifiedContent, patch);
    modifiedContent  = newContent;

    const stats = getPatchStats(patch);
    addBotMsg(`Patch aplicado com sucesso (${stats.files} arquivo(s), +${stats.added} / -${stats.removed} linhas). Arquivo modificado pronto:`);
    addFileMsg(newContent, `modificado_${originalFileName}`);
  } catch (err) {
    removeTyping();
    addBotMsg(`⚠ Erro: ${err.message}`);
  }

  chatStatus.textContent = '● online';
  chatStatus.className   = 'chat-status status-online';
  sendBtn.disabled       = !userInput.value.trim();
}

// ── API ────────────────────────────────────────────
async function generatePatch(instruction, content) {
  const prompt = `You are a code-editing engine. Return ONLY a valid unified diff patch that can be applied directly.\n\nHard rules:\n1) Output only raw patch text (no markdown fences, no explanation).\n2) Use unified diff format with --- and +++ headers and @@ hunks.\n3) Keep indentation and encoding exactly consistent with input file.\n4) Edit only what instruction requests; preserve all other content verbatim.\n5) If no changes are needed, return an empty string.\n\nInstruction: ${instruction}\n\nCurrent file content:\n${content}\n\nUnified diff:`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`;
  const res  = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.1, maxOutputTokens: 8192 }
    })
  });

  if (!res.ok) {
    const errData = await res.json().catch(() => ({}));
    throw new Error(errData?.error?.message || `API error ${res.status}`);
  }

  const data = await res.json();
  let raw = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
  raw = sanitizePatch(raw);

  if (!raw) return '';
  if (!isUnifiedDiff(raw)) {
    throw new Error('Resposta do modelo não está em formato unified diff válido.');
  }

  return raw;
}

function sanitizePatch(raw) {
  return (raw || '')
    .replace(/^```[\w-]*\n?/m, '')
    .replace(/```\s*$/m, '')
    .replace(/^diff --git.*\n/mg, '')
    .trim();
}

function isUnifiedDiff(text) {
  return /(^|\n)---\s+.+\n\+\+\+\s+.+/m.test(text) && /(^|\n)@@\s+[-+0-9, ]+@@/m.test(text);
}

function getPatchStats(patchText) {
  const lines = patchText.split('\n');
  let added = 0;
  let removed = 0;
  let files = 0;

  for (const line of lines) {
    if (line.startsWith('+++ ')) files += 1;
    else if (line.startsWith('+') && !line.startsWith('+++')) added += 1;
    else if (line.startsWith('-') && !line.startsWith('---')) removed += 1;
  }

  return { files, added, removed };
}

function applyPatch(original, patchText) {
  const normalized = sanitizePatch(patchText);
  const result = Diff.applyPatch(original, normalized);
  if (result === false) throw new Error('O patch não pôde ser aplicado ao arquivo atual. Tente uma instrução mais específica.');
  return result;
}

// ── RENDER HELPERS ─────────────────────────────────
function now() {
  return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function scroll() {
  requestAnimationFrame(() => {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

function addUserMsg(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="bubble">
      <div class="bubble-content">${escHtml(text)}</div>
      <div class="bubble-footer"><span class="msg-time">${now()}</span></div>
    </div>`;
  chatMessages.appendChild(row);
  scroll();
}

function addBotMsg(text) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  // Simple bold support via **text**
  const formatted = escHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  row.innerHTML = `
    <div class="bubble">
      <div class="bubble-content">${formatted}</div>
      <div class="bubble-footer"><span class="msg-time">${now()}</span></div>
    </div>`;
  chatMessages.appendChild(row);
  scroll();
}

function showTyping() {
  typingRow = document.createElement('div');
  typingRow.className = 'msg-row bot';
  typingRow.innerHTML = `
    <div class="bubble">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>`;
  chatMessages.appendChild(typingRow);
  scroll();
}

function removeTyping() {
  if (typingRow) { typingRow.remove(); typingRow = null; }
}

function addFileMsg(content, filename) {
  const size = (new Blob([content]).size / 1024).toFixed(1);
  const row  = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="bubble" style="padding:10px;">
      <div class="file-bubble-wrap">
        <div class="file-icon-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <div class="file-meta">
          <div class="file-name-text">${escHtml(filename)}</div>
          <div class="file-size-text">${size} KB · texto</div>
          <button class="download-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Baixar
          </button>
        </div>
      </div>
      <div class="bubble-footer"><span class="msg-time">${now()}</span></div>
    </div>`;

  row.querySelector('.download-btn').onclick = () => {
    const blob = new Blob([content], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };

  chatMessages.appendChild(row);
  scroll();
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
